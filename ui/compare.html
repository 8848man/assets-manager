<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블라인드 비교 · Assets Manager</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; padding: 28px; background: #f6f7f8; color: #202b30; font-family: system-ui, sans-serif; }
    main { max-width: 1080px; margin: auto; }
    h1 { font-size: 1.6rem; }
    .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .compare-card, .compare-setup { background: white; border: 1px solid #d9e0e4; border-radius: 12px; padding: 18px; }
    .compare-card img { display: block; width: 100%; max-height: 440px; object-fit: contain; }
    .compare-card pre { white-space: pre-wrap; font: inherit; }
    label { display: block; margin: 12px 0; font-weight: 600; }
    input[type=text], textarea { box-sizing: border-box; display: block; width: 100%; margin-top: 5px; padding: 8px; border: 1px solid #c4cdd2; border-radius: 6px; font: inherit; }
    textarea { min-height: 100px; }
    .muted { color: #627179; }
    button { margin: 8px 8px 8px 0; padding: 9px 14px; cursor: pointer; }
    #compare-error { color: #a12828; }
  </style>
</head>
<body>
<main>
  <h1>프롬프트 버전 블라인드 비교</h1>
  <p class="muted">같은 세트와 작업으로 만든 두 버전의 결과, 골든 샘플을 넣으세요. 출처를 가리고 섞은 뒤 하나를 고릅니다.</p>
  <section class="compare-setup" id="setup">
    <label>세트 ID<input id="set-id" type="text" required></label>
    <label>같은 작업 설명<textarea id="task" required></textarea></label>
    <div class="compare-grid">
      <div><h2>버전 A</h2><label>버전 이름<input id="version-a" type="text" placeholder="예: 0.13.0"></label><label>결과 텍스트<textarea id="text-a"></textarea></label><label>또는 이미지 파일<input id="file-a" type="file" accept="image/*"></label></div>
      <div><h2>버전 B</h2><label>버전 이름<input id="version-b" type="text" placeholder="예: 0.14.0"></label><label>결과 텍스트<textarea id="text-b"></textarea></label><label>또는 이미지 파일<input id="file-b" type="file" accept="image/*"></label></div>
      <div><h2>골든 샘플</h2><label>결과 텍스트<textarea id="text-golden"></textarea></label><label>또는 이미지 파일<input id="file-golden" type="file" accept="image/*"></label></div>
    </div>
    <p id="compare-error" role="alert"></p>
    <button id="start-compare" type="button">출처를 가리고 비교 시작</button>
  </section>
  <section id="blind" hidden>
    <h2>가장 나은 결과를 고르세요</h2>
    <p class="muted">카드 순서는 이 비교마다 새로 섞입니다. 선택하기 전에는 출처가 보이지 않습니다.</p>
    <div id="cards" class="compare-grid"></div>
    <button id="reveal" type="button">선택하고 출처 보기</button>
    <p id="choice-error" role="alert"></p>
  </section>
  <section id="result" hidden>
    <h2>비교 결과</h2><div id="revealed"></div>
    <button id="download" type="button">결과 JSON 저장</button>
    <button id="again" type="button">새 비교</button>
  </section>
</main>
<script src="compare.js"></script>
</body>
</html>
