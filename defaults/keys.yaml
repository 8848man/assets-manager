# 키 어휘 (레이어 0) — 앱이 제공하는 기본 키 목록입니다.
# 처음 실행할 때 assets/_defaults/로 복사되며, 이후로는 이 파일이 기준입니다.
#
# 각 키의 필드
#   label           화면과 프롬프트에 쓰는 이름
#   domain          common | document | web | content
#   priority        required | recommended | optional  (자동 덜어내기 순서)
#   aliases         동의어. 사용자 정의 키가 여기에 걸리면 병합을 제안합니다.
#   instruction     텍스트 값일 때의 문장 템플릿. {value}
#   ref_instruction 레퍼런스 값일 때의 지시문 템플릿. {n} {file} {title}
#   check           출력 전 자가 점검 문장 (프롬프트 끝 체크리스트에 들어감)
#   precedence      이 키가 다른 키보다 우선하는 범위. [{over: 키, scope: 범위}]
#                   세트에서 precedence: [{first, over, scope}]로 뒤집을 수 있습니다.
#
# parts: (v4) 레퍼런스 이미지에서 분리한 구성 요소의 종류. 메타의 components[].part 값.
#   label / key(같은 측면의 규칙 키: 그 규칙이 있으면 규칙이 요소보다 우선) /
#   ref_instruction({n} {file} {title}) / check({n})
#
# 구체적인 캐릭터나 화풍은 여기에 쓰지 마세요. 여기는 모든 세트가 공유합니다.
# 캐릭터 묘사는 세트의 규칙 값이나 캐릭터 레퍼런스 노드에 둡니다.
version: 4
keys:
  language:
    label: 언어
    domain: common
    priority: required
    aliases: [lang, 언어]
    instruction: "{value}로 작성하세요."
  tone:
    label: 톤과 말투
    domain: common
    priority: required
    aliases: [말투, 어투, voice, writing_tone, 문체]
    instruction: "{value}"
    ref_instruction: "첨부 [{n}] {file}의 말투와 문장 리듬을 따르세요. 내용은 가져오지 마세요."
    check: "처음부터 끝까지 말투가 한 가지로 유지되는가"
  audience_level:
    label: 설명 난이도
    domain: common
    priority: required
    aliases: [difficulty, 난이도, level, 독자수준]
    instruction: "{value}"
    check: "어려운 용어를 처음 쓸 때 쉬운 말로 풀었는가"
  output_format:
    label: 산출물 형식
    domain: common
    priority: required
    aliases: [format, 형식, 포맷]
    instruction: "{value}"
    check: "요청한 산출물 형식을 지켰는가"
  structure:
    label: 구성
    domain: common
    priority: recommended
    aliases: [구조, outline, 목차]
    instruction: "{value}"
    check: "구성 순서를 그대로 따랐는가"
  length:
    label: 분량
    domain: common
    priority: optional
    aliases: [분량, 길이]
    instruction: "{value}"
  forbidden:
    label: 금지 사항
    domain: common
    priority: required
    aliases: [금지, donts, 하지말것]
    instruction: "{value}"
    check: "금지 사항에 해당하는 표현이 하나도 없는가"
  visualization:
    label: 시각화 원칙
    domain: document
    priority: recommended
    aliases: [시각화, visual]
    instruction: "{value}"
    ref_instruction: "첨부 [{n}] {file}처럼 개념을 도식으로 설명하세요. 도식의 형태만 참고하고 내용은 가져오지 마세요."
  chart_style:
    label: 차트·도식 스타일
    domain: document
    priority: recommended
    aliases: [graph_style, 그래프스타일, 차트스타일]
    instruction: "{value}"
    ref_instruction: "도식이나 차트가 필요하면 첨부 [{n}] {file}의 형태(레이아웃, 도형 모양, 라벨 배치, 색 구분 방식)를 따르세요."
    check: "도식의 레이아웃과 라벨 배치가 차트 레퍼런스와 같은 방식인가"
  character_style:
    label: 캐릭터
    domain: content
    priority: required
    aliases: [character, 캐릭터, 캐릭터스타일, mascot]
    instruction: "{value}"
    ref_instruction: "캐릭터는 첨부 [{n}] {file}의 캐릭터를 따르세요(얼굴 표현, 표정 범위, 비례, 개성 표현 방식)."
    check: "캐릭터의 얼굴 표현과 비례가 캐릭터 규칙을 지키는가"
    precedence:
      - { over: image_style, scope: 캐릭터 }
  composition:
    label: 배치와 구도
    domain: content
    priority: recommended
    aliases: [layout_scene, 구도, 배치, scene]
    instruction: "{value}"
    ref_instruction: "배치와 구도는 첨부 [{n}] {file}을 참고하세요(요소 배치, 흐름 방향, 여백)."
    check: "요소 배치와 흐름 방향이 구도 규칙을 따르는가"
  shape_style:
    label: 도형
    domain: content
    priority: recommended
    aliases: [shape, block_style, 도형, 도형스타일]
    instruction: "{value}"
    ref_instruction: "도형(블록, 상자, 아이콘 등)은 첨부 [{n}] {file}의 모양, 모서리 둥글기, 외곽선, 면 채색을 따르세요."
    check: "도형의 모양과 외곽선이 도형 규칙을 따르는가"
    precedence:
      - { over: image_style, scope: 도형 }
  image_style:
    label: 화풍
    domain: content
    priority: recommended
    aliases: [illustration_style, 이미지스타일, 삽화, 화풍]
    instruction: "{value}"
    ref_instruction: "삽화나 이미지 생성 프롬프트가 필요하면 첨부 [{n}] {file}의 화풍(선 굵기, 채색 방식, 질감)을 따르세요."
    check: "선 굵기와 채색 방식이 화풍 레퍼런스와 같은가"
  palette:
    label: 색상 팔레트
    domain: common
    priority: optional
    aliases: [colors, 색상, 컬러]
    instruction: "{value}"
    ref_instruction: "색상은 첨부 [{n}] {file}의 팔레트를 따르세요."
    check: "사용한 색이 팔레트 안에 있는가"
    precedence:
      - { over: chart_style, scope: 색 }
      - { over: image_style, scope: 색 }
  typography:
    label: 타이포그래피
    domain: web
    priority: optional
    aliases: [font, 폰트, 서체]
    instruction: "{value}"
  writing_sample:
    label: 문체 예시
    domain: content
    priority: recommended
    aliases: [paragraph_style, 문단스타일, 글예시]
    instruction: "{value}"
    ref_instruction: "첨부 [{n}] {file}는 문체 예시입니다. 문단 길이, 소제목 방식, 이모지 사용 빈도를 따르고 내용은 가져오지 마세요."
    check: "문단 길이와 소제목 방식이 문체 예시와 비슷한가"
  css_style:
    label: CSS 스타일
    domain: web
    priority: recommended
    aliases: [design, 디자인, design_tokens]
    instruction: "{value}"
    ref_instruction: "첨부 [{n}] {file}의 디자인 토큰(색, 간격, 모서리, 그림자)을 그대로 쓰세요."
    check: "색, 간격, 모서리 값이 디자인 레퍼런스의 값과 같은가"
  animation:
    label: 애니메이션
    domain: web
    priority: optional
    aliases: [motion, 모션, 애니메이션]
    instruction: "{value}"
    ref_instruction: "애니메이션은 첨부 [{n}] {file}의 타이밍과 이징을 따르세요."
  code_convention:
    label: 코드 컨벤션
    domain: web
    priority: recommended
    aliases: [convention, 컨벤션, coding_style]
    instruction: "{value}"
    check: "코드 컨벤션을 지켰는가"
  # ---- 개발 원칙 (domain: dev) — AI 개발 착수 원칙 프리셋에서 사용. 주제마다 다른 키를 써야 상속에서 덮어써지지 않음
  design_approval:
    label: 설계 승인
    domain: dev
    priority: required
    aliases: [설계승인, approval_flow, 초기설계]
    instruction: "{value}"
    check: "핵심 설계를 한 번에 제안하고 사용자 승인을 받은 뒤 진행했는가"
  autonomy:
    label: AI 자율 범위
    domain: dev
    priority: required
    aliases: [자율범위, 위임범위, delegation]
    instruction: "{value}"
    check: "승인된 핵심 계약을 바꾸지 않았는가 (바꿔야 하면 멈추고 해결안을 제안했는가)"
  approval_mode:
    label: 승인 방식 (AUTO/MANUAL)
    domain: dev
    priority: required
    aliases: [승인방식, auto_manual, 승인모드]
    instruction: "{value}"
    check: "AUTO/MANUAL을 위험도만으로 정하지 않았는가"
  approval_evidence:
    label: 승인 근거
    domain: dev
    priority: recommended
    aliases: [승인근거, 승인증거]
    instruction: "{value}"
    check: "Git·ADR 기록을 사용자 승인의 증거로 쓰지 않았는가"
  doc_roles:
    label: 문서 역할
    domain: dev
    priority: recommended
    aliases: [문서역할, documents, 문서구성]
    instruction: "{value}"
    check: "AGENTS.md에서 다른 모든 문서로 가는 길이 있는가"
  sdd_depth:
    label: SDD 깊이
    domain: dev
    priority: recommended
    aliases: [sdd, 명세깊이, spec_depth]
    instruction: "{value}"
    check: "SDD에 목적·제약·수용 기준이 있는가"
  decision_record:
    label: 결정 기록
    domain: dev
    priority: optional
    aliases: [adr, 결정기록]
    instruction: "{value}"
    check: "중요한 결정에 근거·대안·영향·승인 상태가 있는가"
  handoff:
    label: 인수인계
    domain: dev
    priority: optional
    aliases: [인수인계, 핸드오프]
    instruction: "{value}"
  conflict_policy:
    label: 충돌 처리
    domain: dev
    priority: required
    aliases: [충돌처리, conflicts]
    instruction: "{value}"
    check: "명세·코드·ADR 충돌 때 관련 작업만 보류하고 승인을 요청했는가"
  side_effects:
    label: 부작용 확인
    domain: dev
    priority: required
    aliases: [부작용, 실행전확인]
    instruction: "{value}"
    check: "실행 전에 테스트·외부 호출의 부작용을 확인했는가"
  verification:
    label: 검증
    domain: dev
    priority: recommended
    aliases: [검증, testing]
    instruction: "{value}"
  workflow:
    label: 운영 흐름
    domain: dev
    priority: recommended
    aliases: [운영흐름, 작업흐름, process]
    instruction: "{value}"
    check: "운영 흐름의 단계를 건너뛰지 않았는가"
  scope:
    label: 범위와 한계
    domain: dev
    priority: recommended
    aliases: [범위, 한계, boundaries]
    instruction: "{value}"
    check: "범위 밖의 것을 구현하려 하지 않았는가"
  design_system:
    label: 디자인 시스템
    domain: dev
    priority: recommended
    aliases: [디자인시스템, ui_rules]
    instruction: "{value}"
    check: "첫 화면을 만들기 전에 최소 디자인 시스템을 정했는가"
  open_questions:
    label: 제작 전 확인할 것
    domain: dev
    priority: required
    aliases: [미해결, 확인사항, blockers]
    instruction: "작업을 시작하기 전에 사용자에게 먼저 확인하세요: {value}"
    check: "제작 전 확인할 것을 사용자에게 먼저 물었는가"
  golden_sample:
    label: 골든 샘플
    domain: common
    priority: required
    aliases: [정답예시, golden, 완성형]
    instruction: "{value}"
    ref_instruction: "첨부 [{n}] {file}는 이 작업의 완성형 기준(골든 샘플)입니다. 형식과 품질을 이 수준 이상으로 맞추고, 내용은 새 주제에 맞게 쓰세요."
    check: "골든 샘플과 같은 수준의 형식과 완성도인가"

# v4 구성 요소 분리 (레퍼런스 이미지 → 캐릭터·도형·구도)
parts:
  character:
    label: 캐릭터
    key: character_style
    ref_instruction: "캐릭터는 첨부 [{n}] {file}(원본에서 잘라 낸 캐릭터)을 보고 얼굴 표현, 머리와 몸의 비례, 팔다리 모양, 외곽선 굵기를 그대로 따르세요. 자세와 소품은 장면에 맞게 바꿔도 됩니다."
    check: "캐릭터의 얼굴 표현·비례·외곽선이 첨부 [{n}]의 캐릭터와 같은가"
  shape:
    label: 도형
    key: shape_style
    ref_instruction: "도형(블록, 상자, 아이콘 등)은 첨부 [{n}] {file}의 모양, 모서리 둥글기, 외곽선, 면 채색, 라벨을 넣는 위치를 따르세요."
    check: "도형의 모양·모서리·외곽선이 첨부 [{n}]의 도형과 같은가"
  composition:
    label: 구도
    key: composition
    ref_instruction: "배치와 구도는 첨부 [{n}] {file}(원본 위에 덩어리 위치와 흐름 방향을 그린 도식)을 따르세요."
    check: "덩어리 배치와 흐름 방향이 첨부 [{n}]의 구도 도식과 같은가"
